<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      @font-face { font-family: "LINESeedJP_Bd"; src: url("fonts/LINESeedJP_Bd_min.woff2") format("woff2"); }
      @font-face { font-family: "LINESeedJP_Eb"; src: url("fonts/LINESeedJP_Eb_min.woff2") format("woff2"); }
      @font-face { font-family: "LINESeedJP_Rg"; src: url("fonts/LINESeedJP_Rg_min.woff2") format("woff2"); }
      @font-face { font-family: "LINESeedJP_Th"; src: url("fonts/LINESeedJP_Th_min.woff2") format("woff2"); }
    </style>
    <style>
      /*
        ポップ＆ミニマル。
        彩度の高い平面色・大きな角丸・影は falt なオフセット（ぼかし無し）で
        「シールを貼ったような」軽さを出す。装飾は足さない。

        寸法は clamp() で画面幅に追従させ、JavaScript では拡大しない。
      */
      :root {
          --pop-blue:    #4b6bfb;
          --pop-pink:    #ff5f8d;
          --pop-yellow:  #ffd93d;
          --pop-ink:     #23244a;
          --pop-surface: #ffffff;

          /* フラットな影（ぼかさずに真下へずらす） */
          --pop-shadow:  0 4px 0 rgba(35, 36, 74, 0.18);

          --ui-gap:         clamp(12px, 2.4vw, 22px);
          --ui-button-size: clamp(48px, 8vw, 68px);
          --ui-font:        clamp(12px, 2.4vw, 15px);
          --ui-radius:      18px;

          /*
            ダイアログ（web-ui/dialog.js）の色。あちらはプロジェクトに
            依存しないので、この対応付けだけをここに書く。
            カスタムプロパティの継承はシャドウ境界を越えるので中まで届く
          */
          --dialog-surface:  var(--pop-surface);
          --dialog-ink:      var(--pop-ink);
          --dialog-accent:   var(--pop-blue);
          --dialog-backdrop: rgba(35, 36, 74, 0.45);
          --dialog-radius:   var(--ui-radius);

          /* ダイアログ本文の見出し（リソースの出典など）。h2 と h3 を大きさで分ける */
          --dialog-h1-font-size: 1.3em;
          --dialog-h2-font-size: 1.15em;
          --dialog-h2-margin:    1.6em 0 0.4em;
          --dialog-h3-font-size: 1em;

          /* 画面に出す短い知らせ（web-ui/toast.js）。色は既定のまま
             （濃い下地に白文字。どんな背景の上でも読める） */
          --toast-radius: var(--ui-radius);

          /* 画面端の余白（iPhone のノッチ等） */
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          --safe-top:    env(safe-area-inset-top, 0px);
          --safe-left:   env(safe-area-inset-left, 0px);
          --safe-right:  env(safe-area-inset-right, 0px);
      }

      html {
          width: 100%;
          height: 100%;
      }
      body {
          width: 100%;
          height: 100%;
          margin: 0;
          background: skyblue;
          font-family: LINESeedJP_Rg;
          color: var(--pop-ink);
          /* 端末の拡大縮小に文字サイズを引きずられないようにする */
          -webkit-text-size-adjust: 100%;
          overscroll-behavior: none;
      }
      /*
        ブロック編集画面を開くと、左に編集画面・右にアバターの 2 分割になる。
        #screen は position:fixed なので、left をずらすだけで分割できる
        （<three-world> は自分自身の大きさを見ているので追従する）。
        狭い画面では --editor-width を使わず、編集画面が全体を覆う
      */
      #screen {
          left: var(--editor-width, 0px);
          width: auto;
          right: 0;
          height: 100%;
          position: fixed;
          transform: scale(1.0);
          pointer-events: none;

          /* 背景の絵。差し替えは js/background.js が行う */
          background-size: cover;
          background-repeat: no-repeat;
          background-position: center;

          /*
            吹き出しの領域と画面下部の操作列を縦に積む。
            操作列の高さぶんだけ吹き出しが自動で縮むので、
            下端に空ける量を JavaScript で計算する必要がない。
            three-world と #credit は絶対配置なのでこの流れには入らない
          */
          display: flex;
          flex-direction: column;

          /*
            背景を切り替えるときに、次の絵を重ねる層。

            background-image は transition できないので、2 枚重ねて上の透明度
            だけを動かす。変わり切ったら #screen 自身の背景へ移し、この層を
            透明に戻す。どちらも同じ絵になった瞬間に入れ替えるので、継ぎ目は
            見えない。

            z-index:-1 で、3D やボタンより後ろ・#screen 自身の背景より手前に置く
          */
          &::after {
              content: "";
              position: absolute;
              inset: 0;
              z-index: -1;
              background-image: var(--next-background, none);
              background-size: cover;
              background-repeat: no-repeat;
              background-position: center;
              opacity: 0;
              pointer-events: none;
          }
          /* 動かすのは付いている間だけ。外すときは待たずに消したい
             （そのときは下に同じ絵が出ている） */
          &.is-fading::after {
              opacity: 1;
              transition: opacity 0.6s ease;
          }
          /* 動きを減らす設定のときは一瞬で替える。0 にしないのは、終わりの
             合図（transitionend）が出なくなるため */
          @media (prefers-reduced-motion: reduce) {
              &.is-fading::after {
                  transition-duration: 0.001s;
              }
          }
      }

      settings-panel:not(:defined) {
          visibility: hidden;
      }
      three-world {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          /* #screen の pointer-events:none を打ち消す（OrbitControls に必要） */
          pointer-events: auto;
      }
      chat-flow {
          /* 操作列の残り全部を使う */
          flex: 1 1 auto;
          /* flex アイテムの既定は min-height:auto。0 にしないと中身に
             押し広げられて、内部のスクロールが効かなくなる */
          min-height: 0;
          /* three-world（絶対配置）より手前に描くために positioned にする。
             static のままだと、吹き出しが手前に出るかどうかが
             <chat-bubble> 側の position 指定に左右されてしまう */
          position: relative;
          /* 手動でスクロールできるよう、#screen の pointer-events:none を打ち消す */
          pointer-events: auto;
      }

      /*
        画面下部の操作列。左からマイク・認識結果・設定。
        高さは中身が決めるので、認識結果が折り返せばその分だけ背が高くなり、
        <chat-flow> が縮む。大きさは --ui-button-size（clamp）が決める
      */
      #controls-panel {
          /* three-world（絶対配置）より手前に描くために positioned にする。
             static のままだと 3D の描画に隠れる。ボタンが隠れないのは
             要素の内部が position:relative になっているからで、
             認識結果のような素のテキストはここを指定しないと後ろに回る */
          position: relative;

          display: flex;
          align-items: flex-end;
          gap: var(--ui-gap);
          padding: var(--ui-gap);
          padding-left:   calc(var(--ui-gap) + var(--safe-left));
          padding-right:  calc(var(--ui-gap) + var(--safe-right));
          padding-bottom: calc(var(--ui-gap) + var(--safe-bottom));
          /* 3D オブジェクトを操作されないように、#screen の pointer-events:none を打ち消す */
          pointer-events: auto;

          & > * {
              /* 既定の flex-shrink:1 だとボタンが潰れる。
                 ボタンの中身は絶対配置なので内容幅が 0 になり、自動最小サイズも
                 効かない（認識結果を長くするとマイクが数 px まで縮む）。
                 伸び縮みするのは認識結果だけにする */
              flex: 0 0 auto;
          }
      }

      /* 認識結果はボタンの間に収める。幅が足りなければ折り返す */
      #speech-recognition-result {
          /* 操作列の中で伸び縮みするのはこれだけ */
          flex: 1 1 auto;
          /* 表示するだけの要素なので、下の 3D への操作を遮らない */
          pointer-events: none;
          /* flex アイテムの既定 min-width:auto だと max-content 幅になり、
             折り返しても高さに反映されない */
          min-width: 0;
          /* 認識結果に区切りのない長い語（URL など）が来ても折り返す */
          overflow-wrap: anywhere;
          /* 極端に長い認識結果で操作列が伸び続け、ボタンが画面外へ
             押し出されるのを防ぐ。全文は確定後に吹き出しへ残る */
          max-height: calc(1.4em * 3);
          overflow: hidden;
          /* display:flex にすると中身が匿名アイテムになり、上と同じ問題が起きる */
          display: block;
          line-height: 1.4;
          /* 1 行のときにボタンと高さが揃うよう下に余白を入れる。
             行が増えたぶんは上へ伸びる */
          padding-bottom: calc((var(--ui-button-size) - 1.4em) / 2);
          font-size: var(--ui-font);
          font-weight: 700;
          color: var(--pop-ink);
          text-shadow: 0 1px 0 #FFF, 0 -1px 0 #FFF, 1px 0 0 #FFF, -1px 0 0 #FFF;
          opacity: 1;
          /*
            消えるときだけ徐々に透明にする。
            この時間は app.js が transitionDuration から読み取るので、
            変更はここだけで済む。opacity 以外の transition を足す場合は
            app.js の読み取り方も見直すこと
          */
          transition: opacity 0.5s ease;

          &.fade-out {
              opacity: 0;
          }
      }

      /*
        設定ウインドウの中身（light DOM なのでここで整える）。
        range の thumb は擬似要素のため ::slotted() では届かない
      */
      settings-panel label {
          font-size: var(--ui-font);
          font-weight: 700;
      }
      #zoom-slider {
          -webkit-appearance: none;
          appearance: none;
          width: 100%;
          height: 8px;
          margin: 8px 0 0;
          border-radius: 999px;
          background: #e8eaf6;
          outline: none;

          /* つまみ。ブラウザごとに別の擬似要素なので、まとめて書けない
             （片方でも知らない記法があると、規則ごと捨てられる） */
          &::-webkit-slider-thumb {
              -webkit-appearance: none;
              appearance: none;
              width: 22px;
              height: 22px;
              border: none;
              border-radius: 50%;
              background: var(--pop-blue);
              box-shadow: var(--pop-shadow);
              cursor: pointer;
          }
          &::-moz-range-thumb {
              width: 22px;
              height: 22px;
              border: none;
              border-radius: 50%;
              background: var(--pop-blue);
              cursor: pointer;
          }
      }
      #speaker-select {
          width: 100%;
          margin-top: 6px;
          padding: 8px 10px;
          border: none;
          border-radius: 12px;
          background: #eef1ff;
          color: var(--pop-ink);
          font: inherit;
          font-size: var(--ui-font);
          cursor: pointer;
      }
      /*
        メニューの区切り。「操作する」「組み替える」「設定する」を分ける。
        中の小見出し（吹き出しの色など）は破線なので、こちらは実線にして
        階層が読み取れるようにする
      */
      .menu-section + .menu-section {
          margin-top: 14px;
          padding-top: 14px;
          border-top: 2px solid #e3e6f5;
      }
      /* メニューの主な操作。アイコンと文字を並べる */
      .menu-button {
          display: flex;
          align-items: center;
          gap: 8px;
          width: 100%;
          padding: 10px 14px;
          border: none;
          border-radius: 999px;
          background: var(--pop-blue);
          color: #fff;
          font: inherit;
          font-size: var(--ui-font);
          font-weight: 700;
          text-align: left;
          box-shadow: var(--pop-shadow);
          cursor: pointer;

          & + & {
              margin-top: 8px;
          }
          &:active {
              transform: translateY(2px);
              box-shadow: 0 2px 0 rgba(35, 36, 74, 0.18);
          }

          &.menu-button--danger {
              background: var(--pop-pink);
          }

          /*
            読むためだけの項目。操作の邪魔をしないよう、小さく灰色にする。
            影も落とさない（押して何かが変わるボタンではない）
          */
          &.menu-button--quiet {
              padding: 7px 12px;
              background: #eef1ff;
              color: var(--pop-ink);
              font-size: calc(var(--ui-font) * 0.9);
              font-weight: 700;
              box-shadow: none;
              opacity: 0.85;

              & .menu-icon {
                  width: 16px;
                  height: 16px;
              }
              &:active {
                  transform: translateY(1px);
                  box-shadow: none;
              }
          }
      }
      /* 「設定」の見出し。アイコンの大きさはボタンと揃える */
      .menu-heading {
          display: flex;
          align-items: center;
          gap: 8px;
          margin: 0 0 12px;
          font-size: var(--ui-font);
          font-weight: 800;
          opacity: 0.6;
      }
      .menu-icon {
          flex: none;
          width: 18px;
          height: 18px;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
      }
      /* 再生の三角だけは塗る。線画だと中身が抜けて見えづらい */
      #restart-conversation .menu-icon polygon {
          fill: currentColor;
      }
      .settings-note {
          margin: 8px 0 0;
          font-size: 0.85em;
          opacity: 0.6;
      }

      /*
        ブロック編集画面。開いていないときは表示しない。
        Blockly は Shadow DOM の中では座標計算が崩れるため、ここだけ light DOM
      */
      #block-editor {
          /*
            Blockly 自体の見た目は styles/blockly.css が持つ（他のプロジェクト
            でも使えるように分けてある）。この画面の書体だけ、ここから渡す
          */
          --blockly-category-font: 14px LINESeedJP_Rg;

          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: var(--editor-width, 100%);
          height: 100%;
          z-index: 10;
          flex-direction: column;
          background: #ffffff;
          box-shadow: 2px 0 12px rgba(35, 36, 74, 0.18);

          &[open] {
              display: flex;
          }
          /* 狭い画面では全体を覆う。ブロック操作は PC / タブレットを推奨 */
          @media (max-width: 820px) {
              &[open] {
                  width: 100%;
              }
          }

          .editor-bar {
              display: flex;
              align-items: center;
              gap: 8px;
              padding: 8px calc(var(--ui-gap) + var(--safe-left));
              padding-top: calc(8px + var(--safe-top));
              border-bottom: 2px solid #e3e6f5;
              font-size: var(--ui-font);

              & button {
                  flex: 0 0 auto;
                  display: flex;
                  align-items: center;
                  gap: 6px;
                  padding: 8px 14px;
                  border: none;
                  border-radius: 999px;
                  background: var(--pop-blue);
                  color: #fff;
                  font: inherit;
                  font-weight: 700;
                  box-shadow: var(--pop-shadow);
                  cursor: pointer;

                  &:active {
                      transform: translateY(2px);
                      box-shadow: 0 2px 0 rgba(35, 36, 74, 0.18);
                  }
              }
          }

          /* 縮めてよいのはここだけ。ボタンやラジオが縮むと折り返してしまう */
          #editor-status {
              flex: 1 1 auto;
              min-width: 0;
              opacity: 0.7;
              overflow: hidden;
              text-overflow: ellipsis;
              white-space: nowrap;

              &.is-error {
                  color: var(--pop-pink);
                  opacity: 1;
              }
          }

          /*
            閉じるは ✕ だけにして場所を空ける。
            文字が無いぶん詰まりやすいので、指で押せる大きさは確保する
          */
          #editor-file svg {
              width: 1.15em;
              height: 1.15em;
          }
          /* 狭いときはモードの文字と同じく畳む（下の .is-narrow も参照） */
          &.is-narrow #editor-file span {
              display: none;
          }

          #editor-close {
              display: flex;
              align-items: center;
              justify-content: center;
              width: 38px;
              height: 38px;
              padding: 0;
              background: #e3e6f5;
              color: var(--pop-ink);

              & svg {
                  width: 20px;
                  height: 20px;
              }
          }

          /*
            会話モードと編集モードの切り替え。

            トグルボタンだと、ラベルが「今の状態」なのか「押した結果」なのかが
            判別できない。2 つ並べて片方を選ばせる形にすると、モードが 2 つある
            ことも、今どちらなのかも、見ただけで分かる。

            中身は本物のラジオボタン。矢印キーで切り替えられ、読み上げも
            「2 つのうち 1 つ」と正しく伝わる
          */
          #editor-modes {
              display: flex;
              flex: 0 0 auto;
              gap: 2px;
              padding: 2px;
              border-radius: 999px;
              background: #e3e6f5;

              & input {
                  /* 見た目はラベルが受け持つ。display:none にすると
                     キーボードで到達できなくなるので、隠さずに重ねる */
                  position: absolute;
                  width: 1px;
                  height: 1px;
                  opacity: 0;
                  pointer-events: none;
              }
              & label {
                  display: flex;
                  align-items: center;
                  gap: 5px;
                  padding: 6px 12px;
                  border-radius: 999px;
                  font-weight: 700;
                  white-space: nowrap;
                  color: var(--pop-ink);
                  opacity: 0.55;
                  cursor: pointer;

                  & svg {
                      width: 1.15em;
                      height: 1.15em;
                  }
              }
              & input:checked + label {
                  background: var(--pop-surface);
                  box-shadow: 0 1px 0 rgba(35, 36, 74, 0.18);
                  opacity: 1;
              }
              /* キーボードで移動してきたことが分かるようにする */
              & input:focus-visible + label {
                  outline: 2px solid var(--pop-blue);
                  outline-offset: 1px;
              }
          }

          /*
            バーが狭いときは、モードの文字を畳んでアイコンだけにする。
            畳まないと、先に削られるのは縮んでよい状態表示のほうで、
            「編集モードです。…」が 1 文字も読めなくなる。

            狭いかどうかは画面ではなく編集画面の幅で決める（利用者が横幅を
            変えられるので、広い画面でもバーは狭いことがある）。
            判定は app-block-editor.js が .is-narrow で伝えてくる
          */
          &.is-narrow #editor-modes label span {
              /* display:none にすると、読み上げ用の名前まで消えてラジオが
                 「何のボタンか」を答えられなくなる。見た目だけ畳む */
              position: absolute;
              width: 1px;
              height: 1px;
              overflow: hidden;
              clip-path: inset(50%);
              white-space: nowrap;
          }

          #blockly-area {
              flex: 1 1 auto;
              min-height: 0;
          }

          /*
            会話モードではパレットを畳む。読み取り専用でも開けてしまい、
            しかも何も作れないので、触った人が戸惑う。

            この指定は styles/blockly.css へ持っていかない。モードという
            この画面固有の考え方が前提になっているため。

            押せなくはしない。押されたことが分からないと、切り替え方を
            知らせることもできないため（app-block-editor.js の
            TOOLBOX_ITEM_SELECT を参照）。開こうとしたパレットは、
            こちらで閉じたうえで案内を出す。

            !important は、Blockly が開くたびに display:block を style 属性へ
            直接書くため。インラインの指定は、!important の無いスタイルシートの
            指定より強い。閉じている間は Blockly も display:none を書くので、
            付け忘れても効いているように見えてしまう
          */
          &:not(.is-editing) {
              .blocklyToolbox {
                  opacity: 0.35;
              }
              .blocklyFlyout {
                  display: none !important;
              }
          }

          /* 右端の仕切り。つまんで幅を変える */
          #editor-splitter {
              position: absolute;
              top: 0;
              right: -4px;
              width: 10px;
              height: 100%;
              cursor: col-resize;
              touch-action: none;

              @media (max-width: 820px) {
                  display: none;
              }
          }
      }

      /*
        設定ウインドウ内の区切り。
        破線の上下に同じだけ余白を置いて、線がどちらの区画にも寄らないようにする
      */
      .settings-section {
          margin-top: 14px;
          padding-top: 14px;
          border-top: 2px dashed #e3e6f5;

          & color-picker {
              display: block;
              margin-bottom: 10px;

              &:last-child {
                  margin-bottom: 0;
              }
          }
      }
      .settings-heading {
          margin: 0 0 10px;
          font-size: 0.85em;
          font-weight: 800;
          opacity: 0.6;
      }
      /*
        設定のオン・オフ（考え中の吹き出し、連続対話）。文字の前にトグルを並べる。
        ほかの部品（入力欄やボタン）と同じく、枠線ではなく塗りの色で形を見せる。
        オフは淡い地に白いつまみ、オンは青い地に白いつまみ。
        つまみは背景の円で描き、背景の位置で左右に動かす
      */
      .settings-check {
          display: flex;
          align-items: center;
          gap: 8px;
          cursor: pointer;

          & input {
              appearance: none;
              flex-shrink: 0;
              width: 40px;
              height: 24px;
              margin: 0;
              border: none;
              border-radius: 12px;
              background: radial-gradient(circle, #ffffff 8.5px, transparent 9.5px)
                          left center / 24px 24px no-repeat
                          #d5dbf7;
              cursor: pointer;
              transition: background-position 0.15s, background-color 0.15s;

              &:checked {
                  background-position: right center;
                  background-color: var(--pop-blue);
              }
              &:focus-visible {
                  outline: 2px solid var(--pop-blue);
                  outline-offset: 2px;
              }
          }
          &:has(input:disabled) {
              cursor: wait;
              opacity: 0.6;
          }
      }
      /* キャラクタの名前と性格。見た目は話者の select に合わせる */
      #character-name,
      #character-profile {
          display: block;
          box-sizing: border-box;
          width: 100%;
          margin-top: 6px;
          padding: 8px 10px;
          border: none;
          border-radius: 12px;
          background: #eef1ff;
          color: var(--pop-ink);
          font: inherit;
          font-size: var(--ui-font);
          font-weight: 400;

          &::placeholder {
              color: var(--pop-ink);
              opacity: 0.4;
          }
          &:focus-visible {
              outline: 3px solid var(--pop-blue);
              outline-offset: 1px;
          }
      }
      #character-profile {
          resize: vertical;
          min-height: 4.5em;
          line-height: 1.5;
      }

      /* 設定の保存・破棄。場所を取らないよう 1 行に並べる */
      /* 保存 / 破棄。直前の入力欄とくっつかないよう離す */
      .settings-actions {
          display: flex;
          gap: 8px;
          margin-top: 14px;
      }
      .chip {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          min-width: 0;
          padding: 8px 10px;
          border: none;
          border-radius: 999px;
          background: var(--pop-blue);
          color: #fff;
          font: inherit;
          font-size: calc(var(--ui-font) * 0.92);
          font-weight: 700;
          white-space: nowrap;
          box-shadow: var(--pop-shadow);
          cursor: pointer;

          &.chip-danger {
              background: var(--pop-pink);
          }
          &:active {
              transform: translateY(2px);
              box-shadow: 0 2px 0 rgba(35, 36, 74, 0.18);
          }

          /* 実行後は一時的にチェックへ差し替える */
          & .icon-done {
              display: none;
          }
          &[data-done] {
              & .icon-default {
                  display: none;
              }
              & .icon-done {
                  display: block;
              }
          }
      }
      .chip-icon {
          flex: none;
          width: 16px;
          height: 16px;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
      }
      /*
        VOICEVOX の利用規約でクレジット表記が必須。
        最初の吹き出しが右上に出るため、左上へ置いて重ならないようにする
      */
      #credit {
          position: absolute;
          left: calc(var(--ui-gap) + var(--safe-left));
          top: calc(var(--ui-gap) + var(--safe-top));
          padding: 4px 10px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.75);
          color: var(--pop-ink);
          font-size: clamp(10px, 2vw, 12px);
          font-weight: 700;
          pointer-events: none;
      }
      progress-bar {
          width: 80%;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translateX(-50%) translateY(-50%);
      }
    </style>
    <!--
      Blockly の見た目の上書き。他のプロジェクトでも使えるよう、この画面の
      作りに依存しない指定だけを別ファイルにしてある。色や書体は変数で渡す
      （#block-editor の中を参照）。
      モードによってパレットを畳むといった、この画面固有のものは上の <style> 側
    -->
    <link rel="stylesheet" href="./styles/blockly.css">

    <!--
      three.js / three-vrm の参照先はここだけで管理する。
      各 js からは "three" / "three/addons/..." / "@pixiv/three-vrm" で参照すること。
      importmap は、どの module script よりも先に記述する必要がある。
      ファイルは public/vendor/ に置いてある（scripts/setup_vendor.py で取得する）。
      版を上げるときは、あちらとこちらの両方を書き換える
    -->
    <script type="importmap">
      {
          "imports": {
              "three": "./vendor/three@0.169.0/build/three.module.min.js",
              "three/addons/": "./vendor/three@0.169.0/examples/jsm/",
              "@pixiv/three-vrm": "./vendor/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
              "@pixiv/three-vrm-animation": "./vendor/@pixiv/three-vrm-animation@3.4.2/lib/three-vrm-animation.module.min.js"
          }
      }
    </script>

    <!--
      js の読み込みは app.js の import が行う（末尾の script を参照）。
      どのモジュールを使っているかは app.js の先頭を見れば分かる。
    -->

  </head>

  <body>
    <!--
      ブロック編集画面。開くまで Blockly は読み込まない（782KB あるため）。
      編集は誰でもできる。サーバーへ公開できるかどうかだけが合言葉で決まる
    -->
    <div id="block-editor">
      <div class="editor-bar">
        <!--
          見出しは置かない。状態表示（「編集モードです。…」）だけで何の画面かは
          伝わるうえ、幅が狭いとその状態表示が先に削られてしまうため
        -->
        <span id="editor-status"></span>
        <!--
          会話モード（読み取り専用・音声認識が使える・会話でブロックが動く）と
          編集モード（組み替えられる・クリックで試せる・音声認識は止まる）の切り替え。

          アイコンは Lucide（ISC ライセンス）の mic と pencil を埋め込んだもの。
          ローカルで動く雛形なので取りに行かせない。
          マイクの絵が付いた側を離れると音声認識が止まる、と形で分かるようにしている
        -->
        <div id="editor-modes" role="radiogroup" aria-label="モード" hidden>
          <input type="radio" name="editor-mode" id="editor-mode-talk" checked>
          <label for="editor-mode-talk" title="会話モード：話しかけるとブロックが動きます">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 19v3"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <rect x="9" y="2" width="6" height="13" rx="3"/>
            </svg><span>会話モード</span>
          </label>

          <input type="radio" name="editor-mode" id="editor-mode-edit">
          <label for="editor-mode-edit" title="編集モード：組み替えられます。クリックで試せます">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321
                       4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>
              <path d="m15 5 4 4"/>
            </svg><span>編集モード</span>
          </label>
        </div>
        <!--
          読み書きの入口。サーバへの公開も、手元のファイルとのやり取りも、
          押して出てくる一覧から選ぶ（app-block-editor.js の openFileMenu）。
          アイコンは Lucide（ISC ライセンス）の folder
        -->
        <button id="editor-file" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2
                     2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
          </svg><span>ファイル</span>
        </button>
        <!--
          ✕ は閉じる意味が通じるので、場所を空けるため文字を置かない。
          見た目から消えるぶん、読み上げ用のラベルは aria-label に残す。
          アイコンは Lucide（ISC ライセンス）の x
        -->
        <button id="editor-close" type="button" aria-label="閉じる" title="閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18"/>
            <path d="m6 6 12 12"/>
          </svg>
        </button>
      </div>
      <div id="blockly-area"></div>
      <div id="editor-splitter" title="ドラッグして幅を変える"></div>
    </div>

    <div id="screen" style="background-image:url('./backgrounds/pastel_room.png')">
      <three-world>
        <!--
          モーションは animations/motions.json で定義する（既定の待機モーションも）。
          画面に出す名前とファイルの対応をそこで決めるので、ここには書かない
        -->
        <vrm-avatar src="./models/ChibiVita.vrm"
                    position="0, 0, 0"
                    light-intensity="1.8"
                    shadow="0.3">
          <!--
            頭の上に出す感情アイコン。出せる絵は emotes/emotes.json で定義する。
            入れ子は「どのアバターのものか」を表すだけで、three.js の親子関係
            とは一致しない（vrm-emote-element.js を参照）。
            pop を付けると、出るときに膨らみ、消えるときに縮む。外せば
            フェードだけになる（次の <vrm-thinking> も同じ）
          -->
          <vrm-emote src="./emotes/emotes.json"
                     size="0.28"
                     offset="0.18, 0.28, 0"
                     pop></vrm-emote>
          <!--
            返事を考えている間に出す吹き出し。エモートと重ならないよう、
            左右反対の側に出す（vrm-thinking-element.js を参照）
          -->
          <vrm-thinking src="./icons/thinking-bubble.svg"
                        size="0.28"
                        offset="-0.18, 0.28, 0"
                        fade="0.3"
                        pop></vrm-thinking>
        </vrm-avatar>
      </three-world>
      <chat-flow></chat-flow>
      <span id="credit">VOICEVOX:四国めたん</span>

      <!-- 画面下部の操作列。この高さのぶんだけ <chat-flow> が縮む -->
      <div id="controls-panel">
        <speech-recognition></speech-recognition>
        <span id="speech-recognition-result"></span>

        <!--
          メニュー。中身は slot なので自由に差し替えてよい。

          「操作する」「組み替える」「設定する」の 3 つに分ける。
          設定だけではなくなったので、見出しは「メニュー」にしてある

          アイコンは Lucide (ISC License) https://lucide.dev
          play / message-circle-x / settings。
          ブロックのアイコンだけは Lucide に合うものが無いので自作
        -->
        <settings-panel label="メニュー">

          <!-- 1. 会話の操作。ブロックを編集するかどうかに関わらず使う -->
          <div class="menu-section">
            <button id="restart-conversation" class="menu-button" type="button"
                    title="「準備ができたとき」から動かし直す">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <polygon points="6 3 20 12 6 21 6 3"/>
              </svg>
              <span>はじめから実行</span>
            </button>

            <button id="clear-history" class="menu-button menu-button--danger" type="button"
                    title="吹き出しを消して、キャラクタにも忘れさせる">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
                <path d="m15 9-6 6"/>
                <path d="m9 9 6 6"/>
              </svg>
              <span>会話履歴をクリア</span>
            </button>
          </div>

          <!-- 2. ブロックの編集。ACTIONS_EDITABLE=0 のときは app.js が隠す -->
          <div class="menu-section" id="editor-section" hidden>
            <button id="open-editor" class="menu-button" type="button">
              <!--
                積み重なったブロック 2 つ。上の出っ張りが下の凹みへ入る。
                18px で潰れないよう、凹凸は大きめにとってある
              -->
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3.5h14a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5h-7.8v1.6H6.8v-1.6
                         H5A1.5 1.5 0 0 1 3.5 9V5A1.5 1.5 0 0 1 5 3.5Z"/>
                <path d="M5 12.1h1.8v1.6h4.4v-1.6H19a1.5 1.5 0 0 1 1.5 1.5v4a1.5 1.5 0 0 1-1.5 1.5H5
                         a1.5 1.5 0 0 1-1.5-1.5v-4a1.5 1.5 0 0 1 1.5-1.5Z"/>
              </svg>
              <span>ブロックで編集する</span>
            </button>
            <p class="settings-note">画面が左右に分かれます。PC / タブレット推奨</p>
          </div>

          <!-- 3. 設定 -->
          <div class="menu-section">
            <p class="menu-heading">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0
                         l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72
                         v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73
                         l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2
                         v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39
                         a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09
                         a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25
                         a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              設定
            </p>

          <label>キャラクタの近さ
            <input id="zoom-slider" type="range" min="0" max="100" value="50">
          </label>
          <label>話者
            <select id="speaker-select"></select>
          </label>

          <div class="settings-section">
            <p class="settings-heading">吹き出しの色</p>
            <color-picker id="left-fill"  label="キャラクタ / 背景"></color-picker>
            <color-picker id="left-text"  label="キャラクタ / 文字"></color-picker>
            <color-picker id="right-fill" label="あなた / 背景"></color-picker>
            <color-picker id="right-text" label="あなた / 文字"></color-picker>
          </div>

          <div class="settings-section">
            <p class="settings-heading">表示</p>
            <label class="settings-check">
              <input id="thinking-bubble" type="checkbox" role="switch" checked>
              返事を考えている間、吹き出しを出す
            </label>
          </div>

          <div class="settings-section">
            <p class="settings-heading">キャラクタ</p>
            <label>名前
              <input id="character-name" type="text" maxlength="50"
                     placeholder="読み込み中…" autocomplete="off">
            </label>
            <label>性格・設定
              <textarea id="character-profile" rows="4" maxlength="2000"
                        placeholder="例: 元気な高校生。お菓子作りが趣味。"></textarea>
            </label>
          </div>

          <div class="settings-section">
            <p class="settings-heading">話しかけ方</p>
            <label class="settings-check">
              <input id="hands-free" type="checkbox" role="switch">
              ボタンを押さずに話しかける（連続対話）
            </label>
            <p id="hands-free-note" class="settings-note"></p>
          </div>

          <!--
              アイコンは Lucide (ISC License) https://lucide.dev
              save / trash-2 / check
            -->
          <div class="settings-actions">
            <button id="save-settings" class="chip" type="button"
                    title="現在の設定をこの端末に保存する">
              <svg class="chip-icon icon-default" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
                <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/>
                <path d="M7 3v4a1 1 0 0 0 1 1h7"/>
              </svg>
              <svg class="chip-icon icon-done" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
              <span class="chip-label">保存</span>
            </button>

            <button id="reset-settings" class="chip chip-danger" type="button"
                    title="保存した設定を消して初期値に戻す">
              <svg class="chip-icon icon-default" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <svg class="chip-icon icon-done" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
              <span class="chip-label">破棄</span>
            </button>
          </div>
          </div><!-- 設定 -->

          <!--
            4. 謝辞。読むためだけの項目なので、ほかより小さく控えめにする。
            アイコンは Lucide (ISC License) の heart / file-badge
          -->
          <div class="menu-section">
            <p class="menu-heading">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2
                         -1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
              </svg>
              謝辞
            </p>

            <button id="show-acknowledgment" class="menu-button menu-button--quiet"
                    type="button" title="画像や音声などの素材の出典">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
                <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
                <path d="M8 13h8"/>
                <path d="M8 17h5"/>
              </svg>
              <span>リソースの出典</span>
            </button>

            <button id="show-model-info" class="menu-button menu-button--quiet"
                    type="button" title="モデルに埋め込まれた作者と利用許諾">
              <svg class="menu-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2 3 7v10l9 5 9-5V7Z"/>
                <path d="m3 7 9 5 9-5"/>
                <path d="M12 12v10"/>
              </svg>
              <span>3D モデルの情報</span>
            </button>
          </div>
        </settings-panel>
      </div><!-- #controls-panel -->
    </div>
  </body>

  <script type="module" src="./js/app.js"></script>
</html>
