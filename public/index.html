<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <style>
      @font-face { font-family: "LINESeedJP_Bd"; src: url("fonts/LINESeedJP_Bd_min.woff2") format("woff2"); }
      @font-face { font-family: "LINESeedJP_Eb"; src: url("fonts/LINESeedJP_Eb_min.woff2") format("woff2"); }
      @font-face { font-family: "LINESeedJP_Rg"; src: url("fonts/LINESeedJP_Rg_min.woff2") format("woff2"); }
      @font-face { font-family: "LINESeedJP_Th"; src: url("fonts/LINESeedJP_Th_min.woff2") format("woff2"); }
    </style>
    <style>
      /*
        ポップ＆ミニマル。
        彩度の高い平面色・大きな角丸・影は falt なオフセット（ぼかし無し）で
        「シールを貼ったような」軽さを出す。装飾は足さない。

        寸法は clamp() で画面幅に追従させ、JavaScript では拡大しない。
      */
      :root {
          --pop-blue:    #4b6bfb;
          --pop-pink:    #ff5f8d;
          --pop-yellow:  #ffd93d;
          --pop-ink:     #23244a;
          --pop-surface: #ffffff;

          /* フラットな影（ぼかさずに真下へずらす） */
          --pop-shadow:  0 4px 0 rgba(35, 36, 74, 0.18);

          --ui-gap:         clamp(12px, 2.4vw, 22px);
          --ui-button-size: clamp(48px, 8vw, 68px);
          --ui-font:        clamp(12px, 2.4vw, 15px);
          --ui-radius:      18px;

          /* 画面端の余白（iPhone のノッチ等） */
          --safe-bottom: env(safe-area-inset-bottom, 0px);
          --safe-top:    env(safe-area-inset-top, 0px);
          --safe-left:   env(safe-area-inset-left, 0px);
          --safe-right:  env(safe-area-inset-right, 0px);
      }

      html {
          width: 100%;
          height: 100%;
      }
      body {
          width: 100%;
          height: 100%;
          margin: 0;
          background: skyblue;
          font-family: LINESeedJP_Rg;
          color: var(--pop-ink);
          /* 端末の拡大縮小に文字サイズを引きずられないようにする */
          -webkit-text-size-adjust: 100%;
          overscroll-behavior: none;
      }
      /*
        ブロック編集画面を開くと、左に編集画面・右にアバターの 2 分割になる。
        #screen は position:fixed なので、left をずらすだけで分割できる
        （<three-world> は自分自身の大きさを見ているので追従する）。
        狭い画面では --editor-width を使わず、編集画面が全体を覆う
      */
      #screen {
          left: var(--editor-width, 0px);
          width: auto;
          right: 0;
          height: 100%;
          position: fixed;
          transform: scale(1.0);
          /* background: transparent; */
          pointer-events: none;
          /* for background image */
          background-size: cover;
          background-repeat: no-repeat;
          background-position: center;

          /*
            吹き出しの領域と画面下部の操作列を縦に積む。
            操作列の高さぶんだけ吹き出しが自動で縮むので、
            下端に空ける量を JavaScript で計算する必要がない。
            three-world と #credit は絶対配置なのでこの流れには入らない
          */
          display: flex;
          flex-direction: column;
      }
      settings-panel:not(:defined) {
          visibility: hidden;
      }
      three-world {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          /* #screen の pointer-events:none を打ち消す（OrbitControls に必要） */
          pointer-events: auto;
      }
      chat-flow {
          /* 操作列の残り全部を使う */
          flex: 1 1 auto;
          /* flex アイテムの既定は min-height:auto。0 にしないと中身に
             押し広げられて、内部のスクロールが効かなくなる */
          min-height: 0;
          /* three-world（絶対配置）より手前に描くために positioned にする。
             static のままだと、吹き出しが手前に出るかどうかが
             <chat-bubble> 側の position 指定に左右されてしまう */
          position: relative;
          /* 手動でスクロールできるよう、#screen の pointer-events:none を打ち消す */
          pointer-events: auto;
      }

      /*
        画面下部の操作列。左からマイク・認識結果・設定。
        高さは中身が決めるので、認識結果が折り返せばその分だけ背が高くなり、
        <chat-flow> が縮む。大きさは --ui-button-size（clamp）が決める
      */
      #controls-panel {
          /* three-world（絶対配置）より手前に描くために positioned にする。
             static のままだと 3D の描画に隠れる。ボタンが隠れないのは
             要素の内部が position:relative になっているからで、
             認識結果のような素のテキストはここを指定しないと後ろに回る */
          position: relative;

          display: flex;
          align-items: flex-end;
          gap: var(--ui-gap);
          padding: var(--ui-gap);
          padding-left:   calc(var(--ui-gap) + var(--safe-left));
          padding-right:  calc(var(--ui-gap) + var(--safe-right));
          padding-bottom: calc(var(--ui-gap) + var(--safe-bottom));
          /* 帯が画面幅いっぱいに広がるため、そのままだと画面下部で
             3D を掴めなくなる。操作する部品だけを通す */
          pointer-events: none;
      }
      #controls-panel > * {
          pointer-events: auto;
          /* 既定の flex-shrink:1 だとボタンが潰れる。
             ボタンの中身は絶対配置なので内容幅が 0 になり、自動最小サイズも
             効かない（認識結果を長くするとマイクが数 px まで縮む）。
             伸び縮みするのは認識結果だけにする */
          flex: 0 0 auto;
      }

      /* 認識結果はボタンの間に収める。幅が足りなければ折り返す */
      #speech-recognition-result {
          /* 操作列の中で伸び縮みするのはこれだけ */
          flex: 1 1 auto;
          /* 表示するだけの要素なので、下の 3D への操作を遮らない */
          pointer-events: none;
          /* flex アイテムの既定 min-width:auto だと max-content 幅になり、
             折り返しても高さに反映されない */
          min-width: 0;
          /* 認識結果に区切りのない長い語（URL など）が来ても折り返す */
          overflow-wrap: anywhere;
          /* 極端に長い認識結果で操作列が伸び続け、ボタンが画面外へ
             押し出されるのを防ぐ。全文は確定後に吹き出しへ残る */
          max-height: calc(1.4em * 3);
          overflow: hidden;
          /* display:flex にすると中身が匿名アイテムになり、上と同じ問題が起きる */
          display: block;
          line-height: 1.4;
          /* 1 行のときにボタンと高さが揃うよう下に余白を入れる。
             行が増えたぶんは上へ伸びる */
          padding-bottom: calc((var(--ui-button-size) - 1.4em) / 2);
          font-size: var(--ui-font);
          font-weight: 700;
          color: var(--pop-ink);
          text-shadow: 0 1px 0 #FFF, 0 -1px 0 #FFF, 1px 0 0 #FFF, -1px 0 0 #FFF;
          opacity: 1;
          /*
            消えるときだけ徐々に透明にする。
            この時間は app.js が transitionDuration から読み取るので、
            変更はここだけで済む。opacity 以外の transition を足す場合は
            app.js の読み取り方も見直すこと
          */
          transition: opacity 0.5s ease;
      }
      #speech-recognition-result.fade-out {
          opacity: 0;
      }

      /*
        設定ウインドウの中身（light DOM なのでここで整える）。
        range の thumb は擬似要素のため ::slotted() では届かない
      */
      settings-panel label {
          font-size: var(--ui-font);
          font-weight: 700;
      }
      #zoom-slider {
          -webkit-appearance: none;
          appearance: none;
          width: 100%;
          height: 8px;
          margin: 8px 0 0;
          border-radius: 999px;
          background: #e8eaf6;
          outline: none;
      }
      #zoom-slider::-webkit-slider-thumb {
          -webkit-appearance: none;
          appearance: none;
          width: 22px;
          height: 22px;
          border: none;
          border-radius: 50%;
          background: var(--pop-blue);
          box-shadow: var(--pop-shadow);
          cursor: pointer;
      }
      #zoom-slider::-moz-range-thumb {
          width: 22px;
          height: 22px;
          border: none;
          border-radius: 50%;
          background: var(--pop-blue);
          cursor: pointer;
      }
      #speaker-select {
          width: 100%;
          margin-top: 6px;
          padding: 8px 10px;
          border: none;
          border-radius: 12px;
          background: #eef1ff;
          color: var(--pop-ink);
          font: inherit;
          font-size: var(--ui-font);
          cursor: pointer;
      }
      #clear-history {
          width: 100%;
          padding: 10px 12px;
          border: none;
          border-radius: 999px;
          background: var(--pop-pink);
          color: #fff;
          font: inherit;
          font-size: var(--ui-font);
          font-weight: 700;
          box-shadow: var(--pop-shadow);
          cursor: pointer;
      }
      #clear-history:active,
      #open-editor:active {
          transform: translateY(2px);
          box-shadow: 0 2px 0 rgba(35, 36, 74, 0.18);
      }
      #open-editor {
          width: 100%;
          padding: 10px 12px;
          border: none;
          border-radius: 999px;
          background: var(--pop-blue);
          color: #fff;
          font: inherit;
          font-size: var(--ui-font);
          font-weight: 700;
          box-shadow: var(--pop-shadow);
          cursor: pointer;
      }
      .settings-note {
          margin: 8px 0 0;
          font-size: 0.85em;
          opacity: 0.6;
      }

      /*
        ブロック編集画面。開いていないときは表示しない。
        Blockly は Shadow DOM の中では座標計算が崩れるため、ここだけ light DOM
      */
      #block-editor {
          display: none;
          position: fixed;
          top: 0;
          left: 0;
          width: var(--editor-width, 100%);
          height: 100%;
          z-index: 10;
          flex-direction: column;
          background: #ffffff;
          box-shadow: 2px 0 12px rgba(35, 36, 74, 0.18);
      }
      #block-editor[open] {
          display: flex;
      }
      /* 狭い画面では全体を覆う。ブロック操作は PC / タブレットを推奨 */
      @media (max-width: 820px) {
          #block-editor[open] {
              width: 100%;
          }
      }

      .editor-bar {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px calc(var(--ui-gap) + var(--safe-left));
          padding-top: calc(8px + var(--safe-top));
          border-bottom: 2px solid #e3e6f5;
          font-size: var(--ui-font);
      }
      .editor-title {
          margin: 0;
          font-size: 1em;
          font-weight: 800;
      }
      #editor-status {
          flex: 1 1 auto;
          min-width: 0;
          opacity: 0.7;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
      }
      #editor-status.is-error {
          color: var(--pop-pink);
          opacity: 1;
      }
      .editor-bar button {
          flex: 0 0 auto;
          padding: 8px 14px;
          border: none;
          border-radius: 999px;
          background: var(--pop-blue);
          color: #fff;
          font: inherit;
          font-weight: 700;
          box-shadow: var(--pop-shadow);
          cursor: pointer;
      }
      .editor-bar button:active {
          transform: translateY(2px);
          box-shadow: 0 2px 0 rgba(35, 36, 74, 0.18);
      }
      #editor-close {
          background: #e3e6f5;
          color: var(--pop-ink);
      }

      #blockly-area {
          flex: 1 1 auto;
          min-height: 0;
      }

      /* 右端の仕切り。つまんで幅を変える */
      #editor-splitter {
          position: absolute;
          top: 0;
          right: -4px;
          width: 10px;
          height: 100%;
          cursor: col-resize;
          touch-action: none;
      }
      @media (max-width: 820px) {
          #editor-splitter { display: none; }
      }

      /* 設定ウインドウ内の区切り */
      .settings-section {
          padding-top: 12px;
          border-top: 2px dashed #e3e6f5;
      }
      .settings-heading {
          margin: 0 0 10px;
          font-size: 0.85em;
          font-weight: 800;
          opacity: 0.6;
      }
      .settings-section color-picker {
          display: block;
          margin-bottom: 10px;
      }
      .settings-section color-picker:last-child {
          margin-bottom: 0;
      }
      /* キャラクタの名前と性格。見た目は話者の select に合わせる */
      #character-name,
      #character-profile {
          display: block;
          box-sizing: border-box;
          width: 100%;
          margin-top: 6px;
          padding: 8px 10px;
          border: none;
          border-radius: 12px;
          background: #eef1ff;
          color: var(--pop-ink);
          font: inherit;
          font-size: var(--ui-font);
          font-weight: 400;
      }
      #character-profile {
          resize: vertical;
          min-height: 4.5em;
          line-height: 1.5;
      }
      #character-name::placeholder,
      #character-profile::placeholder {
          color: var(--pop-ink);
          opacity: 0.4;
      }
      #character-name:focus-visible,
      #character-profile:focus-visible {
          outline: 3px solid var(--pop-blue);
          outline-offset: 1px;
      }

      /* 設定の保存・破棄。場所を取らないよう 1 行に並べる */
      .settings-actions {
          display: flex;
          gap: 8px;
      }
      .chip {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          min-width: 0;
          padding: 8px 10px;
          border: none;
          border-radius: 999px;
          background: var(--pop-blue);
          color: #fff;
          font: inherit;
          font-size: calc(var(--ui-font) * 0.92);
          font-weight: 700;
          white-space: nowrap;
          box-shadow: var(--pop-shadow);
          cursor: pointer;
      }
      .chip-danger {
          background: var(--pop-pink);
      }
      .chip:active {
          transform: translateY(2px);
          box-shadow: 0 2px 0 rgba(35, 36, 74, 0.18);
      }
      .chip-icon {
          flex: none;
          width: 16px;
          height: 16px;
          fill: none;
          stroke: currentColor;
          stroke-width: 2;
          stroke-linecap: round;
          stroke-linejoin: round;
      }
      /* 実行後は一時的にチェックへ差し替える */
      .chip .icon-done {
          display: none;
      }
      .chip[data-done] .icon-default {
          display: none;
      }
      .chip[data-done] .icon-done {
          display: block;
      }
      /*
        VOICEVOX の利用規約でクレジット表記が必須。
        最初の吹き出しが右上に出るため、左上へ置いて重ならないようにする
      */
      #credit {
          position: absolute;
          left: calc(var(--ui-gap) + var(--safe-left));
          top: calc(var(--ui-gap) + var(--safe-top));
          padding: 4px 10px;
          border-radius: 999px;
          background: rgba(255, 255, 255, 0.75);
          color: var(--pop-ink);
          font-size: clamp(10px, 2vw, 12px);
          font-weight: 700;
          pointer-events: none;
      }
      progress-bar {
          width: 80%;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translateX(-50%) translateY(-50%);
      }
    </style>
    <!--
      Blockly のスタイルを設定する（上書きする）
    -->
    <style>
      .blocklyFlyoutBackground { fill:rgba(240, 240, 240, 0.9) !important }
    </style>

    <!--
      three.js / three-vrm の参照先はここだけで管理する。
      各 js からは "three" / "three/addons/..." / "@pixiv/three-vrm" で参照すること。
      importmap は、どの module script よりも先に記述する必要がある。
    -->
    <script type="importmap">
      {
          "imports": {
              "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
              "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
              "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
              "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3.4.2/lib/three-vrm-animation.module.min.js"
          }
      }
    </script>

    <!--
      js の読み込みは app.js の import が行う（末尾の script を参照）。
      どのモジュールを使っているかは app.js の先頭を見れば分かる。
    -->

  </head>

  <body>
    <!--
      ブロック編集画面。開くまで Blockly は読み込まない（782KB あるため）。
      ACTIONS_EDITABLE=0 のサーバでは、設定ウインドウの開くボタンごと隠れる
    -->
    <div id="block-editor">
      <div class="editor-bar">
        <p class="editor-title">アクション</p>
        <span id="editor-status"></span>
        <button id="editor-save" type="button">保存</button>
        <button id="editor-close" type="button">閉じる</button>
      </div>
      <div id="blockly-area"></div>
      <div id="editor-splitter" title="ドラッグして幅を変える"></div>
    </div>

    <div id="screen" style="background-image:url('./img/flat_room04.png')">
      <three-world>
        <!--
          モーションは animations/motions.json で定義する（既定の待機モーションも）。
          画面に出す名前とファイルの対応をそこで決めるので、ここには書かない
        -->
        <vrm-avatar src="./models/VRM1_Constraint_Twist_Sample.vrm"
                    position="0, 0, 0"
                    light-intensity="1.2"
                    shadow="0.3"></vrm-avatar>
      </three-world>
      <chat-flow></chat-flow>
      <span id="credit">VOICEVOX:四国めたん</span>

      <!-- 画面下部の操作列。この高さのぶんだけ <chat-flow> が縮む -->
      <div id="controls-panel">
        <speech-recognition></speech-recognition>
        <span id="speech-recognition-result"></span>

        <!-- 設定ウインドウ。中身は slot なので自由に差し替えてよい -->
        <settings-panel label="設定">
          <label>キャラクタの近さ
            <input id="zoom-slider" type="range" min="0" max="100" value="50">
          </label>
          <label>話者
            <select id="speaker-select"></select>
          </label>

          <div class="settings-section">
            <p class="settings-heading">吹き出しの色</p>
            <color-picker id="left-fill"  label="キャラクタ / 背景"></color-picker>
            <color-picker id="left-text"  label="キャラクタ / 文字"></color-picker>
            <color-picker id="right-fill" label="あなた / 背景"></color-picker>
            <color-picker id="right-text" label="あなた / 文字"></color-picker>
          </div>

          <div class="settings-section">
            <p class="settings-heading">キャラクタ</p>
            <label>名前
              <input id="character-name" type="text" maxlength="50"
                     placeholder="読み込み中…" autocomplete="off">
            </label>
            <label>性格・設定
              <textarea id="character-profile" rows="4" maxlength="2000"
                        placeholder="例: 元気な高校生。お菓子作りが趣味。"></textarea>
            </label>
          </div>

          <!--
              アイコンは Lucide (ISC License) https://lucide.dev
              save / trash-2 / check
            -->
          <div class="settings-actions">
            <button id="save-settings" class="chip" type="button"
                    title="現在の設定をこの端末に保存する">
              <svg class="chip-icon icon-default" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/>
                <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/>
                <path d="M7 3v4a1 1 0 0 0 1 1h7"/>
              </svg>
              <svg class="chip-icon icon-done" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
              <span class="chip-label">保存</span>
            </button>

            <button id="reset-settings" class="chip chip-danger" type="button"
                    title="保存した設定を消して初期値に戻す">
              <svg class="chip-icon icon-default" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M10 11v6"/>
                <path d="M14 11v6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
                <path d="M3 6h18"/>
                <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              <svg class="chip-icon icon-done" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
              <span class="chip-label">破棄</span>
            </button>
          </div>

          <button id="clear-history" type="button">会話履歴をクリア</button>

        <!--
          アクションの編集。サーバが ACTIONS_EDITABLE=0 のときは app.js が隠す。
          ブロック操作には広い画面が要るので、PC / タブレットを推奨する
        -->
        <div class="settings-section" id="editor-section" hidden>
          <p class="settings-heading">アクション</p>
          <button id="open-editor" type="button">ブロックで編集する</button>
          <p class="settings-note">画面が左右に分かれます。PC / タブレット推奨</p>
        </div>
        </settings-panel>
      </div><!-- #controls-panel -->
    </div>
  </body>

  <script type="module" src="./js/app.js"></script>
</html>
